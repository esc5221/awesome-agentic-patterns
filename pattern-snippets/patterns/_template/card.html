<article class="pattern-card" data-pattern="pattern-id">
  <div class="pattern-header">
    <h2 data-i18n="title">Pattern Title</h2>
    <span class="tag" data-i18n="category">Category</span>
  </div>

  <div class="pattern-content">
    <div class="visual-side">
      <div class="diagram-box">
        <div class="box-header">
          <span class="box-label">Flow</span>
          <div class="tab-switch">
            <button class="tab active" data-tab="ascii">ASCII</button>
            <button class="tab" data-tab="mermaid">Mermaid</button>
          </div>
        </div>
        <div class="tab-content active" data-content="ascii">
          <pre class="ascii-art">A ──▶ B ──▶ C</pre>
        </div>
        <div class="tab-content" data-content="mermaid">
          <div class="mermaid">
flowchart LR
    A --> B --> C
          </div>
        </div>
      </div>

      <div class="code-box">
        <div class="box-header">
          <span class="box-label">Example</span>
        </div>
        <pre><code class="language-python"># code here</code></pre>
      </div>
    </div>

    <div class="description-side">
      <div class="section">
        <div class="section-title">Problem</div>
        <p data-i18n="problem">Problem description</p>
      </div>

      <div class="section">
        <div class="section-title">Solution</div>
        <p data-i18n="solution">Solution description</p>
      </div>

      <div class="section">
        <div class="section-title">When to use</div>
        <ul data-i18n="when">
          <li>Condition 1</li>
          <li>Condition 2</li>
        </ul>
      </div>

      <div class="section">
        <div class="section-title">Trade-offs</div>
        <div class="tradeoffs">
          <div class="tradeoff-col pros">
            <h4>Pros</h4>
            <ul data-i18n="pros">
              <li>Pro 1</li>
            </ul>
          </div>
          <div class="tradeoff-col cons">
            <h4>Cons</h4>
            <ul data-i18n="cons">
              <li>Con 1</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</article>
